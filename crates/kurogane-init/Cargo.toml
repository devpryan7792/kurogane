[package]
name = "kurogane-init"
version = "0.1.0"
edition = "2021"

[dependencies]
nix = { version = "0.29", default-features = false, features = ["mount", "sched", "process", "signal", "fs", "ioctl", "net", "socket", "zerocopy", "event", "time"] }
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
proptest = "1.12.0"
