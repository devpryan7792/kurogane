name: 🐛 Bug Report
description: Report an issue, build failure, or boot error in Kurogane OS
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please report any issues you encounter when building or running Kurogane OS appliances.
  - type: input
    id: recipe_name
    attributes:
      label: Recipe or Command
      description: Which recipe or CLI command produced the bug? (e.g. `recipes/terminal-foot.yaml`, `./kurogane build`)
      placeholder: e.g. ./kurogane run recipes/terminal-foot.yaml
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Host Environment
      description: Host OS distribution, kernel version, QEMU version.
      placeholder: e.g. Arch Linux, Linux 6.12, QEMU 9.1
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description & Logs
      description: What happened? Please paste terminal output or serial console logs.
    validations:
      required: true
