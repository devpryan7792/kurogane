name: "🐛 Bug Report"
description: "Report a bug in the kurogane CLI, micro-supervisor, or an appliance"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or recipe used to reproduce the behavior.
      placeholder: "1. ./kurogane run recipes/terminal-foot.yaml\n2. ..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Host Environment
      description: Linux distribution and kernel version (`uname -r`).
      placeholder: "Ubuntu 24.04, Linux 6.8.0-45-generic, x86_64"
